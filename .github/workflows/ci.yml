name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads the pinned version from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install (once, for all workspaces)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Unit tests
        run: pnpm test

  ios-capture-core:
    # The iOS capture module keeps its state machine in plain Swift (no Core Location, no UIKit)
    # so that it can be tested here, on a Linux runner, on every pull request. What needs a Mac
    # (real SQLCipher, compiling for iOS) runs in build.yml on main.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: SQLite development files
        run: test -e /usr/include/sqlite3.h || (sudo apt-get update && sudo apt-get install -y libsqlite3-dev)
      - name: Swift tests
        working-directory: packages/native-location-capture/ios
        run: swift test
