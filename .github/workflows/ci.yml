name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads the pinned version from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install (once, for all workspaces)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Unit tests
        run: pnpm test

  # The Kotlin capture module is a Gradle build of its own (packages/native-location-capture/android).
  # It needs no pnpm install: it reads the contract files straight from the repo. The runner image
  # ships the Android SDK.
  android-module:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/native-location-capture/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, library build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain

  ios-capture-core:
    # The iOS capture module keeps its state machine in plain Swift (no Core Location, no UIKit)
    # so that it can be tested here, on a Linux runner, on every pull request. What needs a Mac
    # (real SQLCipher, compiling for iOS) runs in build.yml on main.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: SQLite development files
        run: test -e /usr/include/sqlite3.h || (sudo apt-get update && sudo apt-get install -y libsqlite3-dev)
      - name: Swift tests
        working-directory: packages/native-location-capture/ios
        run: swift test
