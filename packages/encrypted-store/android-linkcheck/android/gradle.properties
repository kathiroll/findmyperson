org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true

# The two ABIs phones run. The x86 ones are for emulators, which this project does not use.
reactNativeArchitectures=arm64-v8a,armeabi-v7a
newArchEnabled=true
hermesEnabled=true

# Same opt-outs as the React Native 0.87 app template (AGP 9): Kotlin through the Kotlin plugin.
android.builtInKotlin=false
android.newDsl=false
