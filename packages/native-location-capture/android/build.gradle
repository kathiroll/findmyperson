import groovy.json.JsonSlurper

// The Android implementation of src/specs/NativeLocationCapture.ts. Start at README.md here.
//
// This file builds in two settings:
//   in the app   React Native autolinking includes this directory as a library project. The
//                root project supplies the Android and Kotlin plugins and their versions, and
//                the React Native plugin generates NativeLocationCaptureSpec from the spec.
//   standalone   `./gradlew testDebugUnitTest` in this directory, and CI. There is no React
//                Native build, so the committed copy of the generated class
//                (../contracts/android) is compiled instead, against react-android from Maven.

buildscript {
  if (project == rootProject) {
    repositories {
      google()
      mavenCentral()
    }
    dependencies {
      classpath 'com.android.tools.build:gradle:8.7.3'
      // 2.2 because react-android 0.87 is compiled with it and an older compiler cannot read it.
      classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.0'
    }
  }
}

def standalone = project == rootProject
if (standalone) {
  // Read by the store package's build, which settings.gradle includes as a subproject: there is
  // no React Native build here for it to plug into, and no op-sqlite project to link against.
  ext.fmpWithoutReactNative = true
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
if (!standalone) {
  apply plugin: 'com.facebook.react'
}

def rootExt = { String name, fallback ->
  rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

// React Native version the standalone build compiles against. Keep equal to the version in
// ../package.json; inside the app the React Native plugin picks the version.
def reactNativeVersion = '0.87.1'

// packages/shared/contracts, reached through the real path so it also resolves when this
// directory is seen through a node_modules symlink.
def sharedContracts = new File(projectDir.canonicalFile, '../../shared/contracts').canonicalFile
def generatedSources = new File(buildDir, 'generated/source/fmp/main')
// Its own directory, compiled by the standalone build only: a copy left behind by a standalone
// run must never meet the class React Native generates when the app builds from this directory.
def committedSpecSources = new File(buildDir, 'generated/source/fmpCommittedSpec/main')

android {
  namespace 'dev.findmyperson.locationcapture'
  compileSdk rootExt('compileSdkVersion', 35)

  defaultConfig {
    minSdk rootExt('minSdkVersion', 24)
    consumerProguardFiles 'consumer-rules.pro'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  sourceSets {
    main.java.srcDir generatedSources
    if (standalone) {
      main.java.srcDir committedSpecSources
    }
  }

  testOptions {
    unitTests.returnDefaultValues = true
    unitTests.all {
      // Tests read the contract files of the repo by path.
      systemProperty 'fmp.sharedContracts', sharedContracts.path
      systemProperty 'fmp.moduleContracts', new File(projectDir.canonicalFile, '../contracts').canonicalPath
      systemProperty 'fmp.manifest', new File(projectDir, 'src/main/AndroidManifest.xml').path
      testLogging {
        events 'failed'
        exceptionFormat 'full'
      }
    }
  }

  lint {
    abortOnError true
  }
}

kotlin {
  compilerOptions {
    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
  }
}

// StoreContract.java: the SQL this module may run and the cipher parameters it must open the
// store with, taken from packages/shared/contracts at build time. Nothing in src/ restates them.
def generateStoreContract = tasks.register('generateStoreContract') {
  def writerFile = new File(sharedContracts, 'native-writer.json')
  def cipherFile = new File(sharedContracts, 'cipher-params.json')
  def outFile = new File(generatedSources, 'dev/findmyperson/locationcapture/store/StoreContract.java')
  inputs.files(writerFile, cipherFile)
  outputs.file(outFile)
  doLast {
    def writer = new JsonSlurper().parse(writerFile)
    def cipher = new JsonSlurper().parse(cipherFile)
    def str = { value -> '"' + value.toString().replace('\\', '\\\\').replace('"', '\\"') + '"' }
    outFile.parentFile.mkdirs()
    outFile.text = """\
// GENERATED by the generateStoreContract task from packages/shared/contracts/native-writer.json
// and cipher-params.json. Do not edit: change those files (through packages/shared) instead.
package dev.findmyperson.locationcapture.store;

public final class StoreContract {
  private StoreContract() {}

  public static final int SCHEMA_VERSION = ${writer.schemaVersion as int};
  public static final String READ_SCHEMA_VERSION_SQL = ${str(writer.readSchemaVersionSql)};
  public static final String STORE_FILE_NAME = ${str(writer.storeFileName)};
  public static final String INSERT_LOCATION_SAMPLE_SQL = ${str(writer.insertLocationSampleSql)};
  public static final String[] SAMPLE_SOURCES = {${writer.sampleSources.collect { str(it) }.join(', ')}};

  public static final long RETENTION_SEC = ${writer.retentionSec as long}L;
  public static final String DELETE_SAMPLES_BEFORE_SQL = ${str(writer.deleteSamplesBeforeSql)};
  public static final String DELETE_STAYS_ENDED_BEFORE_SQL = ${str(writer.deleteStaysEndedBeforeSql)};
  public static final String TRIM_STAYS_STARTED_BEFORE_SQL = ${str(writer.trimStaysStartedBeforeSql)};
  public static final String REWIND_STAY_CURSOR_SQL = ${str(writer.rewindStayCursorSql)};

  public static final int SQLCIPHER_MAJOR = ${cipher.sqlcipherMajor as int};
  public static final int CIPHER_COMPATIBILITY = ${cipher.cipherCompatibility as int};
  public static final int PAGE_SIZE_BYTES = ${cipher.pageSizeBytes as int};
  public static final int KDF_ITERATIONS = ${cipher.kdfIterations as int};
  public static final String KDF_ALGORITHM = ${str(cipher.kdfAlgorithm)};
  public static final String HMAC_ALGORITHM = ${str(cipher.hmacAlgorithm)};
  public static final int KEY_BYTES = ${cipher.keyBytes as int};
  public static final String JOURNAL_MODE = ${str(cipher.journalMode)};
}
"""
  }
}

// Standalone only: put the committed copy of the generated spec class where the compiler looks
// for its package. Inside the app the React Native plugin generates the same class.
def copyCommittedSpec = tasks.register('copyCommittedSpec', Copy) {
  from new File(projectDir.canonicalFile, '../contracts/android')
  include 'NativeLocationCaptureSpec.java'
  into new File(committedSpecSources, 'dev/findmyperson/locationcapture')
}

tasks.named('preBuild').configure {
  dependsOn generateStoreContract
  if (standalone) {
    dependsOn copyCommittedSpec
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  if (standalone) {
    compileOnly "com.facebook.react:react-android:${reactNativeVersion}"
  } else {
    implementation 'com.facebook.react:react-android'
  }

  implementation 'androidx.core:core:1.15.0'
  // The future type PackageManagerCompat.getUnusedAppRestrictionsStatus returns.
  implementation 'androidx.concurrent:concurrent-futures:1.1.0'
  implementation 'androidx.work:work-runtime:2.10.0'
  implementation 'com.google.android.gms:play-services-location:21.3.0'

  // The store package (packages/encrypted-store/android), for its SqlcipherConnection: the one
  // way to SQLite on Android, through the SQLCipher inside op-sqlite's library. This module must
  // not depend on a library that carries a SQLite of its own. The project name is the one React
  // Native's autolinking gives @findmyperson/encrypted-store; settings.gradle uses the same.
  implementation project(':findmyperson_encrypted-store')

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
  // The reference H3, as the oracle the Kotlin port in core/H3.kt is checked against.
  testImplementation 'com.uber:h3:4.5.0'
  // A real SQLite to run the contract's statements against the real schema.
  testImplementation 'org.xerial:sqlite-jdbc:3.46.1.3'
}
