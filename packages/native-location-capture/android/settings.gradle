// Used only when this directory is built by itself: `./gradlew testDebugUnitTest` here, and the
// `android-module` CI job. Inside the app this directory is one autolinked library project and
// this file is not read.
pluginManagement {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
}
dependencyResolutionManagement {
  repositories {
    google()
    mavenCentral()
  }
}
rootProject.name = 'findmyperson-native-location-capture'

// The store package, whose SqlcipherConnection this module opens the store with. Inside the app
// autolinking includes it under this same name.
include ':findmyperson_encrypted-store'
project(':findmyperson_encrypted-store').projectDir = new File(settingsDir, '../../encrypted-store/android')
